spring.application.name=ieojuda

# .env 파일 import
spring.config.import=optional:file:.env[.properties]

# JPA + Hibernate Setting
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#Postgresql DB 연결
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

#openAI
openai.api-key=${OPENAI_API_KEY}
openai.api-url=https://api.openai.com/v1/chat/completions
openai.model=gpt-3.5-turbo
#Gmail 설정
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

#공식 증빙 자료 제출 - 파일 최대 10MB (스펙상 제한과 동일하게 서버 단에서도 넉넉히 잡음)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

#암호화 증빙 저장소(S3) 설정 - EC2 배포 전까지 로컬 자격증명 사용
aws.s3.bucket=${AWS_S3_BUCKET}
aws.s3.region=${AWS_S3_REGION}
aws.s3.access-key=${AWS_ACCESS_KEY_ID}
aws.s3.secret-key=${AWS_SECRET_ACCESS_KEY}

#JWT 설정 - Access 1시간, Refresh 14일
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration-ms=3600000
jwt.refresh-token-expiration-ms=1209600000

#역할 수락 링크 / 문의 주소 설정
#프론트 주소
app.base-url=${APP_BASE_URL}
#문의 주소( HTML 형식으로 바꿀 떄  삭제 예정)
app.contact-email=${APP_CONTACT_EMAIL}
# 초대 링크 토큰 시간
app.invite-token-ttl-hours=72