spring.application.name=${APP_NAME}

# .env 파일 import
spring.config.import=optional:file:.env[.properties]

# JPA + Hibernate Setting
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO}
spring.jpa.show-sql=${JPA_SHOW_SQL}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL}

#Postgresql DB 연결
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER_CLASS_NAME}

#openAI
openai.api-key=${OPENAI_API_KEY}
openai.api-url=${OPENAI_API_URL}
openai.model=${OPENAI_MODEL}
#Gmail 설정
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE}
# SMTP 타임아웃 (issue #51) - 기본값은 무제한 대기라 응답 없는 서버에 스레드가 계속 묶일 수 있음
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_SMTP_CONNECTION_TIMEOUT_MS}
spring.mail.properties.mail.smtp.timeout=${MAIL_SMTP_TIMEOUT_MS}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_SMTP_WRITE_TIMEOUT_MS}

# Resilience4j - 이메일 발송 (issue #51). 짧은 재시도로 순간적인 블립만 흡수하고,
# 그래도 계속 실패하면 EmailOutbox.attemptCount가 다음 스케줄러 주기에 다시 시도한다.
resilience4j.retry.instances.emailSend.max-attempts=${RESILIENCE4J_EMAIL_RETRY_MAX_ATTEMPTS}
resilience4j.retry.instances.emailSend.wait-duration=${RESILIENCE4J_EMAIL_RETRY_WAIT_DURATION}
resilience4j.retry.instances.emailSend.enable-exponential-backoff=${RESILIENCE4J_EMAIL_RETRY_EXPONENTIAL_BACKOFF}
resilience4j.retry.instances.emailSend.exponential-backoff-multiplier=${RESILIENCE4J_EMAIL_RETRY_BACKOFF_MULTIPLIER}
resilience4j.circuitbreaker.instances.emailSend.sliding-window-size=${RESILIENCE4J_EMAIL_CB_SLIDING_WINDOW_SIZE}
resilience4j.circuitbreaker.instances.emailSend.failure-rate-threshold=${RESILIENCE4J_EMAIL_CB_FAILURE_RATE_THRESHOLD}
resilience4j.circuitbreaker.instances.emailSend.wait-duration-in-open-state=${RESILIENCE4J_EMAIL_CB_WAIT_DURATION_OPEN}
resilience4j.circuitbreaker.instances.emailSend.permitted-number-of-calls-in-half-open-state=${RESILIENCE4J_EMAIL_CB_PERMITTED_CALLS_HALF_OPEN}

# Resilience4j - S3 (issue #51). s3Put은 사용자 대면 업로드 경로라 짧게, s3Get/s3Delete는
# 백그라운드 스케줄러가 다음 주기에 다시 시도해주므로 상대적으로 여유를 둔다.
resilience4j.retry.instances.s3Put.max-attempts=${RESILIENCE4J_S3PUT_RETRY_MAX_ATTEMPTS}
resilience4j.retry.instances.s3Put.wait-duration=${RESILIENCE4J_S3PUT_RETRY_WAIT_DURATION}
resilience4j.retry.instances.s3Get.max-attempts=${RESILIENCE4J_S3GET_RETRY_MAX_ATTEMPTS}
resilience4j.retry.instances.s3Get.wait-duration=${RESILIENCE4J_S3GET_RETRY_WAIT_DURATION}
resilience4j.retry.instances.s3Delete.max-attempts=${RESILIENCE4J_S3DELETE_RETRY_MAX_ATTEMPTS}
resilience4j.retry.instances.s3Delete.wait-duration=${RESILIENCE4J_S3DELETE_RETRY_WAIT_DURATION}
resilience4j.circuitbreaker.instances.s3Put.sliding-window-size=${RESILIENCE4J_S3PUT_CB_SLIDING_WINDOW_SIZE}
resilience4j.circuitbreaker.instances.s3Put.failure-rate-threshold=${RESILIENCE4J_S3PUT_CB_FAILURE_RATE_THRESHOLD}
resilience4j.circuitbreaker.instances.s3Put.wait-duration-in-open-state=${RESILIENCE4J_S3PUT_CB_WAIT_DURATION_OPEN}
resilience4j.circuitbreaker.instances.s3Get.sliding-window-size=${RESILIENCE4J_S3GET_CB_SLIDING_WINDOW_SIZE}
resilience4j.circuitbreaker.instances.s3Get.failure-rate-threshold=${RESILIENCE4J_S3GET_CB_FAILURE_RATE_THRESHOLD}
resilience4j.circuitbreaker.instances.s3Get.wait-duration-in-open-state=${RESILIENCE4J_S3GET_CB_WAIT_DURATION_OPEN}
resilience4j.circuitbreaker.instances.s3Delete.sliding-window-size=${RESILIENCE4J_S3DELETE_CB_SLIDING_WINDOW_SIZE}
resilience4j.circuitbreaker.instances.s3Delete.failure-rate-threshold=${RESILIENCE4J_S3DELETE_CB_FAILURE_RATE_THRESHOLD}
resilience4j.circuitbreaker.instances.s3Delete.wait-duration-in-open-state=${RESILIENCE4J_S3DELETE_CB_WAIT_DURATION_OPEN}

# 공식 증빙 자료 제출 - 파일당 50MB, 요청 전체 55MB
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE}
server.tomcat.max-swallow-size=${TOMCAT_MAX_SWALLOW_SIZE}

#암호화 증빙 저장소(S3) 설정 - EC2 배포 전까지 로컬 자격증명 사용
aws.s3.bucket=${AWS_S3_BUCKET}
aws.s3.region=${AWS_S3_REGION}
aws.s3.access-key=${AWS_ACCESS_KEY_ID}
aws.s3.secret-key=${AWS_SECRET_ACCESS_KEY}

#JWT 설정 - Access 1시간, Refresh 14일
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration-ms=${JWT_ACCESS_TOKEN_EXPIRATION_MS}
jwt.refresh-token-expiration-ms=${JWT_REFRESH_TOKEN_EXPIRATION_MS}
jwt.issuer=${JWT_ISSUER}
jwt.audience=${JWT_AUDIENCE}

#역할 수락 링크 / 문의 주소 설정
#프론트 주소
app.base-url=${APP_BASE_URL}
#문의 주소( HTML 형식으로 바꿀 떄  삭제 예정)
app.contact-email=${APP_CONTACT_EMAIL}
# 초대 링크 토큰 시간
app.invite-token-ttl-hours=${APP_INVITE_TOKEN_TTL_HOURS}
# issue #41 - 수락 완료 후 발급되는 사망신고/증빙제출 등 장기 보안 토큰의 수명(일)
app.active-token-ttl-days=${APP_ACTIVE_TOKEN_TTL_DAYS}
# 이메일 아웃박스 워커 최대 재시도 횟수 (issue #51)
app.email.outbox.max-attempts=${APP_EMAIL_OUTBOX_MAX_ATTEMPTS}
